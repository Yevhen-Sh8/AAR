services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aar
      POSTGRES_PASSWORD: aar
      POSTGRES_DB: aar
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aar"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ../apps/api
    environment:
      AAR_DATABASE_URL: postgresql+asyncpg://aar:aar@db:5432/aar
      AAR_REDIS_URL: redis://redis:6379/0
      AAR_JWT_SECRET: change-me
      # Local preview: migrate + seed demo data (creates the bootstrap admin
      # admin@aar.local / aar-admin-2026 and ~3000 synthetic events) so the
      # stack is usable immediately. Set to "false" for an empty DB.
      AAR_SEED_ON_START: "true"
      AAR_ADMIN_EMAIL: admin@aar.local
      AAR_ADMIN_PASSWORD: aar-admin-2026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    # No command override: the image entrypoint (start.sh) runs migrations,
    # optional seed, then uvicorn on $PORT (8000).

  web:
    build: ../apps/web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
