name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy aar_api
      - run: pytest -q

  migrations:
    name: Migrations (fresh DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: alembic upgrade head applies cleanly on an empty DB
        env:
          AAR_DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: alembic upgrade head
      - name: full downgrade then upgrade round-trips
        env:
          AAR_DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: |
          alembic downgrade base
          alembic upgrade head

  audit:
    name: pip-audit (deps CVE scan)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - run: pip install -e ".[dev]"
      - name: Scan installed packages for known CVEs
        # --skip-editable ignores the local editable install (aar-api itself),
        # which is not on PyPI and cannot be audited. We must NOT combine it with
        # --strict: --strict fails on any skipped dependency, so it would turn the
        # deliberate skip back into an error. pip-audit still exits non-zero when a
        # real third-party CVE is found, which is the signal we actually want.
        run: pip-audit --skip-editable

  web:
    name: Web (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: tsc -b
      - run: npm run build
      - run: npm test
