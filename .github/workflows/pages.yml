name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, claude/equipment-tracking-system-3lB6U]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install + build (demo mode)
        working-directory: apps/web
        run: |
          npm install
          VITE_DEMO=true VITE_BASE=/AAR/ npm run build

      - name: Add SPA fallback (404.html = index.html for client-side routing)
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Add .nojekyll (Pages would otherwise ignore _-prefixed files)
        run: touch apps/web/dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
